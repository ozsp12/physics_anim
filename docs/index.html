<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Loading Physics Animations</title>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #08111f;
      color: #edf4ff;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 42rem; padding: 2rem; text-align: center; }
    a { color: #55c8ff; }
  </style>
</head>
<body>
  <main id="status" aria-live="polite">
    <p>Loading the vertical-loop simulation…</p>
  </main>
  <script>
    (() => {
      const source = 'https://raw.githubusercontent.com/ozsp12/physics_anim/main/rollercoster_loop/index.html';
      const baseHref = 'https://raw.githubusercontent.com/ozsp12/physics_anim/main/rollercoster_loop/';
      const status = document.getElementById('status');

      fetch(source, { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then((html) => {
          const base = `<base href="${baseHref}">`;
          const hydrated = html.replace(/<head(\s[^>]*)?>/i, (match) => `${match}${base}`);
          document.open();
          document.write(hydrated);
          document.close();
        })
        .catch((error) => {
          status.innerHTML = `<h1>Unable to load the simulation</h1><p>${error.message}</p><p><a href="https://github.com/ozsp12/physics_anim/tree/main/rollercoster_loop">Open the source code on GitHub</a>.</p>`;
        });
    })();
  </script>
</body>
</html>
