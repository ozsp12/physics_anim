name: Validate physics simulations

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run JavaScript physics, integration, and numerical tests
        run: node --test rollercoaster-loop/tests/test_model.js rollercoaster-loop/tests/test_integration.js rollercoaster-loop/tests/test_numerics.js

      - name: Run independent Python analytical tests
        run: python -m unittest discover -s rollercoaster-loop/tests -p 'test_model.py' -v

      - name: Install browser test tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:browser
