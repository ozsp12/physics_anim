name: Apply PhysLab integration refactor

on:
  push:
    branches:
      - agent/complete-physlab-refactor

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/complete-physlab-refactor

      - name: Integrate tested physics core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path('rollercoster_loop/index.html')
          text = path.read_text(encoding='utf-8')

          text = replace_once(text,
              '  <script>\n    (() => {',
              '  <script src="physics-model.js"></script>\n  <script>\n    (() => {',
              'script include')

          text = replace_once(text,
              '      const G = 9.81;\n      const MASS = 1;\n      const TAU = Math.PI * 2;',
              '      const { G, criticalHeight, speedSquaredFromEnergy, normalAccelerationFromState, tangentialAcceleration, shouldDetach } = window.VerticalLoopPhysics;\n      const MASS = 1;\n      const TAU = Math.PI * 2;',
              'physics imports')

          text = replace_once(text,
              '        const hCritical = 2.5 * sim.R;',
              '        const hCritical = criticalHeight(sim.R);',
              'critical prediction')

          text = replace_once(text,
              '        sim.v = Math.sqrt(Math.max(0, 2 * G * sim.h));',
              '        sim.v = Math.sqrt(Math.max(0, speedSquaredFromEnergy(sim.h, sim.R, 0, G)));',
              'entry speed')

          text = replace_once(text,
              '      function integrateLoop(dt) {\n        const q = sim.h / sim.R;\n        const acceleration = -G * Math.sin(sim.theta);',
              '      function integrateLoop(dt) {\n        const acceleration = tangentialAcceleration(sim.theta, G);',
              'loop acceleration')

          text = replace_once(text,
              '        sim.normal = MASS * (sim.v * sim.v / sim.R + G * Math.cos(sim.theta));',
              '        sim.normal = MASS * normalAccelerationFromState(sim.v, sim.R, sim.theta, G);',
              'normal reaction')

          text = replace_once(text,
              '        if (q < 2.5 - 1e-7 && sim.normal <= 0 && sim.theta > 0.02) {\n          detach();\n          return;\n        }',
              '        if (shouldDetach({\n          theta: sim.theta,\n          speed: sim.v,\n          normalAcceleration: sim.normal / MASS\n        })) {\n          detach();\n          return;\n        }',
              'detachment event')

          text = replace_once(text,
              '        const critical = clamp(2.5 * Number(el.r.value), Number(el.h.min), Number(el.h.max));',
              '        const critical = clamp(criticalHeight(Number(el.r.value)), Number(el.h.min), Number(el.h.max));',
              'critical control')

          path.write_text(text, encoding='utf-8')
          PY

          cat > rollercoster_loop/tests/test_integration.js <<'EOF'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const test = require('node:test');

          const indexPath = path.join(__dirname, '..', 'index.html');
          const html = fs.readFileSync(indexPath, 'utf8');

          test('browser application loads the tested physics core', () => {
            assert.match(html, /<script src="physics-model\.js"><\/script>/);
            assert.match(html, /window\.VerticalLoopPhysics/);
          });

          test('loop integration delegates physical calculations to physics-model.js', () => {
            assert.match(html, /tangentialAcceleration\(sim\.theta, G\)/);
            assert.match(html, /normalAccelerationFromState\(sim\.v, sim\.R, sim\.theta, G\)/);
            assert.match(html, /shouldDetach\(\{/);
            assert.doesNotMatch(html, /q < 2\.5 - 1e-7 && sim\.normal <= 0/);
          });

          test('critical-height control uses the shared analytical model', () => {
            assert.match(html, /criticalHeight\(Number\(el\.r\.value\)\)/);
          });
          EOF

      - name: Run validation
        run: |
          node --test rollercoster_loop/tests/test_model.js rollercoster_loop/tests/test_integration.js
          python -m unittest discover -s rollercoster_loop/tests -p 'test_model.py' -v

      - name: Commit integration
        run: |
          rm .github/workflows/_apply_refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate tested physics core with browser simulation"
          git push origin HEAD:agent/complete-physlab-refactor
